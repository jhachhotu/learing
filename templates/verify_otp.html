<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - YourApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .otp-input {
            letter-spacing: 1.5em;
            text-align: center;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="auth-section d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="auth-card p-4">
                        <h2 class="text-center mb-4">Verify Your Email</h2>
                        
                        <div id="alert" class="alert d-none"></div>
                        
                        <form id="otpForm">
                            <div class="mb-4">
                                <label for="otp" class="form-label">Enter Verification Code</label>
                                <input type="text" 
                                       class="form-control otp-input" 
                                       id="otp" 
                                       maxlength="6" 
                                       required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Verify</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('alert');
            const email = localStorage.getItem('temp_email');
            
            if (!email) {
                window.location.href = '/signup';
                return;
            }
            
            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        otp: document.getElementById('otp').value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert.className = 'alert alert-success';
                    alert.textContent = 'Email verified successfully!';
                    localStorage.removeItem('temp_email');
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    alert.className = 'alert alert-danger';
                    alert.textContent = data.error;
                }
            } catch (error) {
                alert.className = 'alert alert-danger';
                alert.textContent = 'An error occurred. Please try again.';
            }
            
            alert.classList.remove('d-none');
        });
    </script>
</body>
</html>
