<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - YourApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: #667eea;">
        <div class="container">
            <a class="navbar-brand" href="/">YourApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div id="loadingMessage" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading your dashboard...</p>
        </div>
        
        <div id="dashboardContent" class="d-none">
            <h1>Welcome to Dashboard</h1>
            <div id="userInfo"></div>
        </div>
    </div>

    <script>
        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/api/check-auth', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Authentication failed');
                }

                const data = await response.json();
                
                // Show dashboard content
                document.getElementById('loadingMessage').classList.add('d-none');
                document.getElementById('dashboardContent').classList.remove('d-none');
                
                // Display user info
                document.getElementById('userInfo').innerHTML = `
                    <div class="card mt-4">
                        <div class="card-body">
                            <h5 class="card-title">User Information</h5>
                            <p class="card-text">Name: ${data.user.full_name}</p>
                            <p class="card-text">Email: ${data.user.email}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
                // Try to refresh token
                try {
                    const refreshToken = localStorage.getItem('refresh_token');
                    if (refreshToken) {
                        const refreshResponse = await fetch('/api/refresh', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${refreshToken}`
                            }
                        });
                        
                        if (refreshResponse.ok) {
                            const refreshData = await refreshResponse.json();
                            localStorage.setItem('access_token', refreshData.access_token);
                            window.location.reload();
                            return;
                        }
                    }
                } catch (refreshError) {
                    console.error('Refresh Error:', refreshError);
                }
                
                // If everything fails, redirect to login
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login';
            }
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
