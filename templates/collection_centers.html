{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Collection Centers</h2>
    
    <!-- Add Center Form -->
    <div class="card mb-4">
        <div class="card-body">
            <h4>Add New Collection Center</h4>
            <form id="centerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Center Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" required>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" required>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label for="state" class="form-label">State</label>
                        <input type="text" class="form-control" id="state" required>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label for="pincode" class="form-label">Pincode</label>
                        <input type="text" class="form-control" id="pincode" required 
                               pattern="[0-9]{6}" title="Please enter a valid 6-digit pincode">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="contact_number" class="form-label">Contact Number</label>
                        <input type="tel" class="form-control" id="contact_number" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="capacity" class="form-label">Capacity (kg)</label>
                        <input type="number" class="form-control" id="capacity" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Accepted Waste Types</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="Electronics" id="type1">
                        <label class="form-check-label" for="type1">Electronics</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="Batteries" id="type2">
                        <label class="form-check-label" for="type2">Batteries</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="Appliances" id="type3">
                        <label class="form-check-label" for="type3">Appliances</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="operating_hours" class="form-label">Operating Hours</label>
                    <input type="text" class="form-control" id="operating_hours" 
                           placeholder="e.g., Mon-Fri: 9 AM - 5 PM" required>
                </div>

                <button type="submit" class="btn btn-primary">Add Collection Center</button>
            </form>
        </div>
    </div>

    <!-- Centers List with Pickup Requests -->
    <div class="row" id="centersList">
        <!-- Centers will be loaded here -->
    </div>
</div>

<script>
async function loadCenters() {
    try {
        const response = await fetch('/api/collection-centers', {
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
            }
        });
        const data = await response.json();
        
        const centersList = document.getElementById('centersList');
        centersList.innerHTML = data.centers.map(center => `
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">${center.name}</h5>
                        <p class="card-text">
                            <strong>Address:</strong> ${center.address}, ${center.city}, ${center.state} - ${center.pincode}<br>
                            <strong>Contact:</strong> ${center.contact_number}<br>
                            <strong>Email:</strong> ${center.email}<br>
                            <strong>Capacity:</strong> ${center.capacity} kg<br>
                            <strong>Waste Types:</strong> ${center.waste_types.join(', ')}<br>
                            <strong>Hours:</strong> ${center.operating_hours}
                        </p>
                        
                        <!-- Pickup Requests Section -->
                        <div class="mt-3">
                            <h6>Assigned Pickup Requests</h6>
                            <div id="requests-${center.id}" class="pickup-requests">
                                Loading requests...
                            </div>
                        </div>
                        
                        <button class="btn btn-info mt-2" 
                                onclick="loadCenterRequests(${center.id})">
                            View Pickup Requests
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
        
        // Load requests for each center
        data.centers.forEach(center => loadCenterRequests(center.id));
    } catch (error) {
        console.error('Error loading centers:', error);
    }
}

async function loadCenterRequests(centerId) {
    try {
        const response = await fetch(`/api/collection-center/${centerId}/requests`, {
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
            }
        });
        const data = await response.json();
        
        const requestsDiv = document.getElementById(`requests-${centerId}`);
        if (data.requests.length === 0) {
            requestsDiv.innerHTML = '<p class="text-muted">No pickup requests assigned</p>';
        } else {
            requestsDiv.innerHTML = data.requests.map(req => `
                <div class="card mb-2">
                    <div class="card-body">
                        <small>
                            Request #${req.id}<br>
                            Date: ${new Date(req.pickup_date).toLocaleString()}<br>
                            Status: <span class="badge bg-${req.status === 'pending' ? 'warning' : 'success'}">
                                ${req.status}
                            </span>
                        </small>
                    </div>
                </div>
            `).join('');
        }
    } catch (error) {
        console.error('Error loading requests:', error);
    }
}

document.getElementById('centerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const wasteTypes = ['type1', 'type2', 'type3']
        .filter(id => document.getElementById(id).checked)
        .map(id => document.getElementById(id).value);

    try {
        const response = await fetch('/api/collection-centers', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
            },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                pincode: document.getElementById('pincode').value,
                contact_number: document.getElementById('contact_number').value,
                email: document.getElementById('email').value,
                capacity: parseInt(document.getElementById('capacity').value),
                waste_types: wasteTypes,
                operating_hours: document.getElementById('operating_hours').value
            })
        });

        const data = await response.json();
        
        if (response.ok) {
            alert('Collection center added successfully!');
            this.reset();
            loadCenters();
        } else {
            throw new Error(data.error);
        }
    } catch (error) {
        alert('Error adding collection center: ' + error.message);
    }
});

// Load centers when page loads
document.addEventListener('DOMContentLoaded', loadCenters);
</script>
{% endblock %}
