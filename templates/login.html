<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Waste Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-section {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            min-height: 100vh;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25);
        }
        .btn-primary {
            background: #667eea;
            border: none;
            padding: 10px 20px;
        }
        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="auth-section d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="auth-card p-4">
                        <h2 class="text-center mb-4">Welcome Back</h2>
                        
                        <div id="alert" class="alert d-none"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mb-3" id="submitBtn">
                                <span id="btnText">Login</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                            
                            <p class="text-center mb-0">
                                Don't have an account? <a href="/signup" class="text-decoration-none">Sign Up</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add system status check
        async function checkSystemStatus() {
            try {
                const response = await fetch('/api/system-status');
                const data = await response.json();
                return data.status === 'healthy';
            } catch (error) {
                console.error('System status check failed:', error);
                return false;
            }
        }

        // Update login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alert = document.getElementById('alert');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            
            // Check system status first
            const isSystemHealthy = await checkSystemStatus();
            if (!isSystemHealthy) {
                alert.className = 'alert alert-danger';
                alert.textContent = 'System is currently unavailable. Please try again later.';
                alert.classList.remove('d-none');
                return;
            }
            
            // Show loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Logging in...';
            btnSpinner.classList.remove('d-none');
            alert.classList.add('d-none');
            
            try {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                
                // Basic validation
                if (!email || !password) {
                    throw new Error('Please fill in all fields');
                }
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert.className = 'alert alert-success';
                    alert.textContent = 'Login successful! Redirecting...';
                    
                    // Store token properly
                    localStorage.setItem('access_token', data.access_token);
                    console.log('Token stored:', data.access_token); // Debug log
                    
                    // Handle redirect
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');
                    const feature = urlParams.get('feature');
                    
                    setTimeout(() => {
                        if (redirect && feature) {
                            window.location.href = `/${redirect}?feature=${feature}`;
                        } else {
                            window.location.href = '/dashboard';
                        }
                    }, 1000);
                } else if (response.status === 403 && data.require_verification) {
                    alert.className = 'alert alert-warning';
                    alert.textContent = 'Please check your email for a verification code.';
                    localStorage.setItem('temp_email', email);
                    
                    setTimeout(() => {
                        window.location.href = '/verify-otp';
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Login failed. Please try again.');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert.className = 'alert alert-danger';
                alert.textContent = error.message || 'An error occurred. Please try again.';
                
                // Reset form state
                submitBtn.disabled = false;
                btnText.textContent = 'Login';
                btnSpinner.classList.add('d-none');
            }
            
            alert.classList.remove('d-none');
        });

        // Check stored credentials on page load
        window.addEventListener('load', async () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                try {
                    const response = await fetch('/api/check-auth', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirect = urlParams.get('redirect');
                        const feature = urlParams.get('feature');
                        
                        if (redirect && feature) {
                            window.location.href = `/${redirect}?feature=${feature}`;
                        } else {
                            window.location.href = '/dashboard';
                        }
                    } else {
                        // Clear invalid tokens
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        localStorage.removeItem('user_data');
                    }
                } catch (error) {
                    console.error('Auth check error:', error);
                    localStorage.clear();  // Clear all stored data
                }
            }
        });
    </script>
</body>
</html>
